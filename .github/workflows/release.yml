name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # A PR opened with GITHUB_TOKEN does not run its pull_request workflows
      # unattended, so the required `build` check never reports. workflow_dispatch
      # is exempt from that rule; on a non-master ref it verifies without
      # deploying.
      - name: Run the required build check on the release PR
        if: steps.release.outputs.prs_created == 'true'
        # The runner evaluates env before `if`, and `pr` is unset when there is
        # no release PR, so parse it in the script rather than with fromJSON.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -er .headBranchName <<<"$RELEASE_PR")
          gh workflow run deploy.yml --repo "$REPO" --ref "$branch"
