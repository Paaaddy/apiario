name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
  # Run the `build` job on PRs targeting master too so branch
  # protection's required check is satisfied. The `deploy` job below
  # is gated on `github.event_name == 'push'`, so PR builds verify
  # the artifact compiles without shipping anything to Pages.
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped per ref rather than sharing the single global `pages` group with
    # the deploy job below. Under one shared group, two open PRs (and any
    # push to master) queued behind each other for no reason — a PR build
    # ships nothing, so it has no bearing on the Pages environment.
    # Superseded PR builds are cancelled; master builds are left to finish
    # because a deploy depends on them.
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Current active LTS. Node 20 is still supported but 22 is
          # the version everything in this repo targets today.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # --no-audit --no-fund silences the audit summary and funding
      # footer that were showing up as warnings in CI. --prefer-offline
      # is harmless when the npm cache is cold and speeds up the step
      # when it is warm.
      - run: npm ci --no-fund --prefer-offline

      # Audit gate: fail on high/critical vulnerabilities in production deps.
      # Runs after install but before tests so CI fails fast on supply-chain issues.
      - run: npm audit --omit=dev --audit-level=high

      # Tests gate the deploy. Without this, a compromised dependency that
      # builds cleanly would auto-merge via dependabot-automerge.yml and
      # ship to every installed PWA via the autoUpdate service worker.
      - run: npm run test:run

      - run: npm run build -- --base /apiario/

      # Only ship the artifact when this run was triggered by a push to
      # master (or a manual dispatch). PR builds stop at the build step
      # — they verify the artifact compiles, nothing more.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub's official recommendation for the `pages` concurrency group: do
    # NOT cancel in-progress deployments — cancelling one can leave the
    # environment half-applied. Keep it false and let the queue drain. This
    # now sits on the deploy job, which is what actually touches Pages,
    # instead of on the whole workflow.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
