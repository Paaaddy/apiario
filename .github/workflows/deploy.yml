name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the required PR check named build. Even fork and Dependabot PRs
  # verify, without deployment credentials or write permissions.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --prefer-offline
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - uses: actions/upload-artifact@v6
        with:
          name: cloudflare-pages
          path: dist
          if-no-files-found: error
          retention-days: 1
      # Separate output prevents the legacy subpath/SW entering Cloudflare.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: npm run build -- --base /apiario/ --outDir dist-legacy
        env:
          VITE_LEGACY_HOST: 'true'
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-legacy

  cloudflare:
    needs: build
    # Never deploy forks, Dependabot (secrets are unavailable), or manually
    # dispatched non-master refs. PR branch names are not shell inputs.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'pull_request' && 'cloudflare-preview' || 'cloudflare-production' }}
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      # No PR source checkout or project install in the credentialed job.
      - uses: actions/download-artifact@v7
        with:
          name: cloudflare-pages
          path: dist
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets.' >&2
            exit 1
          fi
          # Refuse a suffixed hostname or incorrect production branch rather
          # than publish a migration notice pointing at another project's app.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/apiario" \
            | jq -e '.success == true and .result.subdomain == "apiario.pages.dev" and .result.production_branch == "master"' > /dev/null
      - name: Deploy verified assets
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=apiario --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'master' }}
      - name: Report deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: echo "Cloudflare Pages deployment — $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

  # Transitional only: do not remove until the owner approves retirement.
  # Publish the migration notice only once its destination is deployed.
  deploy:
    needs: [build, cloudflare]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
